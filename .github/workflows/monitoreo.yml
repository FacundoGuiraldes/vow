name: Monitoreo

on:
  schedule:
    - cron: "*/10 * * * *"   # landing + salud (mantiene despierta la API en Render, no toca Neon)
    - cron: "17 */6 * * *"   # catálogo (sí consulta Neon)
  workflow_dispatch:

concurrency:
  group: monitoreo-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SITIO_URL: https://vow-17x.pages.dev
  API_URL: ${{ secrets.API_URL }}

jobs:
  salud:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/10 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Secreto API_URL configurado
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error title=Falta API_URL::Cargá el secreto API_URL en Settings > Secrets and variables > Actions (URL base de la API en Render, sin barra final)."
            exit 1
          fi

      - name: Landing responde
        run: |
          curl --silent --show-error --fail --retry 3 --retry-delay 10 --retry-all-errors --max-time 30 \
            "$SITIO_URL/" -o landing.html
          grep -q "VOW" landing.html
          echo "Landing OK" >> "$GITHUB_STEP_SUMMARY"

      - name: API despierta y sana
        run: |
          # Render (plan gratis) puede tardar 50-60 s en despertar. Primero un pedido
          # que solo despierta y no falla el job; después la verificación real, con
          # hasta ~3 min de margen en total.
          curl --silent --max-time 90 "$API_URL/api/salud" -o /dev/null || true
          curl --silent --show-error --fail --retry 5 --retry-delay 20 --retry-all-errors --max-time 60 \
            "$API_URL/api/salud" -o salud.json
          grep -q '"ok":true' salud.json
          echo "API OK" >> "$GITHUB_STEP_SUMMARY"

  catalogo:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 */6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Secreto API_URL configurado
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error title=Falta API_URL::Cargá el secreto API_URL en Settings > Secrets and variables > Actions (URL base de la API en Render, sin barra final)."
            exit 1
          fi

      - name: Catálogo del Drop 01
        run: |
          curl --silent --show-error --fail --retry 4 --retry-delay 15 --retry-all-errors --max-time 90 \
            "$API_URL/api/productos?drop=1" -o productos.json
          total=$(jq '.productos | length' productos.json)
          echo "Productos en el Drop 01: $total"
          test "$total" -gt 0
          echo "Catálogo OK ($total productos)" >> "$GITHUB_STEP_SUMMARY"
