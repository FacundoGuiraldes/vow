<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Oficina VOW</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Recorrido en primera persona sin caminar: la cámara viaja entre puntos fijos (pasillo y cinco salas) y se acerca a los tableros con un toque. */
:root{
  --negro:#0A0A0A; --hueso:#ECE8E1; --beige:#CDBFA6; --bordo:#8B2A36; --linea:#4a4741;
  --f-display:'Unbounded','Arial Black',sans-serif; --f-body:'Archivo','Helvetica Neue',Arial,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--negro);color:var(--hueso);font-family:var(--f-body);font-size:15px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:var(--negro)}
#app{position:fixed;inset:0}
canvas#gl{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;pointer-events:none}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 52%,rgba(0,0,0,.42) 100%)}
#grano{position:absolute;inset:0;pointer-events:none;opacity:.07;mix-blend-mode:overlay}
#sala{left:max(16px,env(safe-area-inset-left,0px));top:max(16px,env(safe-area-inset-top,0px));text-shadow:0 1px 3px rgba(0,0,0,.85),0 0 10px rgba(0,0,0,.6)}
#sala b{display:block;font:700 13px/1.1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--hueso)}
#sala span{display:block;margin-top:6px;font:400 12px/1.3 var(--f-mono);color:var(--beige)}
#sala span.viejo{color:#e0a458}
#pista{left:50%;top:50%;transform:translate(-50%,-50%);width:min(300px,78vw);text-align:center;background:rgba(10,10,10,.72);padding:12px 16px;font:400 14px/1.45 var(--f-body);transition:opacity .6s}
#pista.off{opacity:0}
#llamado{left:50%;top:calc(max(16px,env(safe-area-inset-top,0px)) + 62px);transform:translateX(-50%);background:var(--negro);border:1px solid var(--bordo);padding:7px 12px;font:500 13px var(--f-body);white-space:nowrap}
#accion{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(max(10px,env(safe-area-inset-bottom,0px)) + 64px);display:none;font:600 15px var(--f-body);background:var(--hueso);color:var(--negro);border:0;padding:0 24px;min-height:48px;cursor:pointer;box-shadow:0 6px 22px rgba(0,0,0,.45)}
#accion.on{display:block}
#nav{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;overflow-x:auto;padding:26px max(12px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));background:linear-gradient(to top,rgba(10,10,10,.82),rgba(10,10,10,0));scrollbar-width:none;touch-action:pan-x}
#nav::-webkit-scrollbar{display:none}
#nav button{flex:0 0 auto;min-height:44px;padding:0 14px;display:flex;align-items:center;gap:8px;font:500 14px var(--f-body);color:var(--hueso);background:rgba(10,10,10,.72);border:1px solid var(--linea);cursor:pointer}
#nav button i{width:9px;height:9px;border-radius:50%;background:#888}
#nav button.act{background:var(--hueso);color:var(--negro);border-color:var(--hueso)}
#nav button.pend::after{content:"";width:8px;height:8px;background:var(--bordo);transform:rotate(45deg);margin-left:2px}
#nav button:focus-visible,#accion:focus-visible,.cerrar:focus-visible,#dialogo button:focus-visible{outline:2px solid var(--beige);outline-offset:2px}
#app.dlg #nav,#app.dlg #accion{display:none}
#dialogo{position:absolute;left:0;right:0;bottom:0;display:none;padding:0 max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
#dialogo.on{display:flex;justify-content:center}
#dialogo .caja{width:min(560px,100%);background:var(--hueso);color:var(--negro);padding:14px 16px;box-shadow:0 10px 36px rgba(0,0,0,.55);max-height:60vh;overflow:auto}
#dialogo .quien{display:flex;align-items:center;gap:8px;margin-bottom:8px;font:700 12px var(--f-display);letter-spacing:.06em;text-transform:uppercase}
#dialogo .quien i{width:10px;height:10px;border-radius:50%}
#dT p{margin:0 0 6px;line-height:1.45;font-size:15.5px}
#dT ul{margin:0 0 8px;padding-left:18px;line-height:1.4;font-size:15px}
#dT .mono{font:400 12px/1.4 var(--f-mono);color:#5d584f}
#dialogo .botones{display:flex;gap:10px;margin-top:12px}
#dialogo button{flex:1;min-height:48px;font:600 15px var(--f-body);border:1px solid var(--negro);cursor:pointer}
#dialogo .principal{background:var(--negro);color:var(--hueso)}
#dialogo .sec{background:transparent;color:var(--negro)}
#panel{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,10,10,.7);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));touch-action:pan-y}
#panel.on{display:flex}
.hoja{background:var(--hueso);color:var(--negro);width:min(760px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.5);-webkit-user-select:text;user-select:text}
.hoja header{display:flex;align-items:flex-start;gap:12px;padding:18px 22px 12px;border-bottom:1px solid #b9b2a4}
.hoja header h2{margin:0;flex:1;font:700 17px/1.2 var(--f-display);letter-spacing:.01em}
.hoja header small{display:block;margin-top:6px;font:400 12px var(--f-mono);color:#5d584f}
button.cerrar{font:500 14px var(--f-body);border:1px solid var(--negro);background:transparent;padding:0 14px;min-height:40px;cursor:pointer;color:var(--negro)}
.hoja .cuerpo{overflow:auto;padding:16px 22px 24px;line-height:1.55;font-size:15px;min-width:0;touch-action:pan-y}
.cuerpo h3,.cuerpo h4{font-family:var(--f-display);margin:20px 0 6px;font-size:14px;line-height:1.25}
.cuerpo h4{font-size:13px}.cuerpo p{margin:0 0 9px}.cuerpo ul{margin:0 0 10px;padding-left:20px}
.cuerpo .mono{font:400 12.5px/1.5 var(--f-mono);overflow-wrap:anywhere}
.fila{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #cfc9bb}
.fila:last-child{border-bottom:0}
.fila .fe{flex:0 0 78px;font:500 13px var(--f-mono)}
.fila .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.chip{display:inline-block;font:500 11px var(--f-mono);padding:2px 7px;margin-left:6px;vertical-align:1px;background:var(--negro);color:var(--hueso)}
.chip.ok{background:#cfc9bb;color:var(--negro)}.chip.pend{background:var(--bordo)}.chip.prog{background:var(--beige);color:var(--negro)}
.pasado{opacity:.5;text-decoration:line-through}
.sala-p{display:inline-block;width:9px;height:9px;margin-right:7px;border-radius:50%}
.vacio{color:#6b655a;font-style:italic}
@media (max-width:640px){#panel{padding:0}.hoja{width:100%;height:100%;box-shadow:none}.hoja header{padding-top:max(14px,env(safe-area-inset-top,0px))}.hoja .cuerpo{padding:14px 16px 20px}}
@media (prefers-reduced-motion:reduce){#pista{transition:none}}

.hoja .acc{display:flex;gap:8px;flex:0 0 auto;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.ck{font:600 13px var(--f-body);min-height:36px;padding:0 12px;border:1px solid var(--negro);background:var(--negro);color:var(--hueso);cursor:pointer}
.ck.sec{background:transparent;color:var(--negro)}
.fila.hecho .tx{opacity:.7}
.pieza{padding:14px 0;border-bottom:1px solid #cfc9bb}.pieza:last-child{border-bottom:0}
.pieza .ph{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.pieza .acc{justify-content:flex-start;margin-top:8px}
.gal{display:flex;gap:8px;overflow-x:auto;padding:8px 0;touch-action:pan-x}
.gal img{height:150px;width:auto;flex:0 0 auto;border:1px solid #b9b2a4;cursor:pointer;background:#ddd}
video.vid{width:min(220px,70%);display:block;margin:8px 0;background:#000}
details{margin:8px 0}details summary{cursor:pointer;font:600 14px var(--f-body);padding:6px 0}
i.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
form.nota{display:flex;flex-direction:column;gap:8px;margin-top:10px}
form.nota input,form.nota select{font:15px var(--f-body);min-height:42px;padding:0 10px;border:1px solid var(--negro);background:#f6f3ec;color:var(--negro);-webkit-user-select:text;user-select:text}
form.nota input{width:100%;box-sizing:border-box}
form.nota .fil2{display:flex;gap:8px}form.nota .fil2 select{flex:1;min-width:0}
#dT ul.tareas{list-style:none;padding:0}
#dT ul.tareas li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid #cfc9bb}
#dT .ck{flex:0 0 auto}
#visor{position:absolute;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,5,5,.94);touch-action:pan-y}
#visor.on{display:flex}
#visor img{max-width:96vw;max-height:78vh;object-fit:contain}
#visor .bar{display:flex;gap:10px;align-items:center;margin-top:14px;color:var(--hueso);font:500 14px var(--f-mono)}
#visor button{min-height:44px;min-width:56px;font:600 15px var(--f-body);background:var(--hueso);color:var(--negro);border:0}
#toast{position:absolute;left:50%;top:max(70px,calc(env(safe-area-inset-top,0px) + 70px));transform:translateX(-50%);background:var(--hueso);color:var(--negro);padding:9px 14px;font:600 14px var(--f-body);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40;max-width:86vw}
#toast.on{opacity:1}

#clave{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(5,5,5,.88)}
#clave.on{display:flex}
#clave form{background:var(--hueso);color:var(--negro);padding:20px;width:min(360px,88vw);display:flex;flex-direction:column;gap:12px}
#clave h3{margin:0;font:700 17px var(--f-display)}
#clave p{margin:0;font:14px/1.4 var(--f-body)}
#clave input{font:16px var(--f-body);min-height:46px;padding:0 10px;border:1px solid var(--negro);background:#f6f3ec;color:var(--negro);-webkit-user-select:text;user-select:text}
#clave .fil{display:flex;gap:8px}#clave button{flex:1;min-height:44px;font:600 15px var(--f-body);border:1px solid var(--negro);background:var(--negro);color:var(--hueso)}#clave button.sec{background:transparent;color:var(--negro)}
</style>
</head>
<body>


<div id="app">
  <canvas id="gl" aria-label="Vista en primera persona de la oficina"></canvas>
  <div id="vig"></div><canvas id="grano" width="160" height="160"></canvas>
  <div class="hud" id="sala"><b id="salaN">Pasillo</b><span id="salaD">conectando…</span></div>
  <div class="hud" id="pista">Tocá una sala abajo para ir. Arrastrá para mirar alrededor. Tocá un tablero para acercarte.</div>
  <div class="hud" id="llamado" hidden></div>
  <button id="accion" type="button"></button>
  <nav id="nav" aria-label="Salas"></nav>
  <div id="dialogo" role="dialog" aria-live="polite"><div class="caja"><div class="quien"><i id="dQ"></i><span id="dN"></span></div><div id="dT"></div><div class="botones"><button class="principal" id="dVer" type="button"></button><button class="sec" id="dDesp" type="button">Después</button></div></div></div>
  <div id="panel"><div class="hoja" role="dialog" aria-modal="true"><header><h2 id="pT"></h2><button class="cerrar" id="pX" type="button">Cerrar</button></header><div class="cuerpo" id="pC"></div></div></div>
</div>

<div id="visor"><img id="visorImg" alt=""><div class="bar"><button id="visorP" type="button">‹</button><span id="visorN"></span><button id="visorS" type="button">›</button><button id="visorX" type="button">Cerrar</button></div></div><div id="clave" role="dialog" aria-label="Clave de la oficina"><form id="claveForm" autocomplete="off"><h3>Clave de la oficina</h3><p id="claveMsg"></p><input id="claveIn" type="password" placeholder="Clave" autocomplete="off" autocapitalize="off"><div class="fil"><button type="button" class="sec" id="claveCerrar">Ahora no</button><button type="submit">Entrar</button></div></form></div>
<div id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i)};
var BR={hueso:'#ECE8E1',negro:'#0A0A0A',beige:'#CDBFA6',bordo:'#8B2A36'};
var SALA={
  estrategia:{n:'Estrategia',c:'#B58A3F'},bot:{n:'Bot',c:'#5E8793'},diseno:{n:'Diseño',c:'#9A2F3C'},
  deposito:{n:'Depósito',c:'#7E8450'},recepcion:{n:'Recepción',c:'#CDBFA6'}
};
var D={},conectado='no',HECHO={},MED={},NOTAS={},dbx=null;
/* ---------- fechas ---------- */
function hoy(){var d=new Date();d.setHours(0,0,0,0);return d}
function pd(s){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?new Date(+m[1],m[2]-1,+m[3]):null}
function dd(d){return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')}
function ddy(d){return dd(d)+'/'+d.getFullYear()}
function dias(d){return Math.round((d-hoy())/864e5)}
function rel(n){if(n===0)return 'hoy';if(n===1)return 'mañana';if(n===-1)return 'ayer';return n>0?'en '+n+' días':'hace '+(-n)+' días'}
function llegada(s){
  if(!s)return null;
  var m=/(\d{1,2})\s*(?:[–-]\s*(\d{1,2}))?\s*\/\s*(\d{1,2})/.exec(s);if(!m)return null;
  var y=(pd(D.actualizado)||new Date()).getFullYear(),mo=+m[3]-1;
  return {desde:new Date(y,mo,+m[1]),hasta:new Date(y,mo,+(m[2]||m[1]))};
}
function estadoLlegada(s){
  var l=llegada(s);if(!l)return {txt:'Sin fecha',llego:false,fecha:'—'};
  var f=l.desde.getTime()===l.hasta.getTime()?dd(l.hasta):dd(l.desde)+'–'+dd(l.hasta);
  var n=dias(l.hasta);
  if(n>0)return {txt:'faltan '+(dias(l.desde)>0?dias(l.desde)+' a '+n:n)+' días',llego:false,fecha:f};
  if(n===0)return {txt:'llega hoy',llego:false,fecha:f};
  return {txt:'pasó la fecha estimada: verificar',llego:true,fecha:f};
}
function lista(k){var a=Array.isArray(D[k])?D[k]:[];return k==='pendientes'?a.filter(function(p){return !HECHO[kPend(p)]}):a}

function tx(g,s,x,y,font,color,al){g.font=font;g.fillStyle=color;g.textAlign=al||'left';g.textBaseline='alphabetic';g.fillText(s,x,y)}
function ajustar(g,s,x,y,mw,lh,max,font,color){
  g.font=font;g.fillStyle=color;g.textAlign='left';g.textBaseline='alphabetic';
  var pal=String(s||'').split(/\s+/),ln='',n=0;
  for(var i=0;i<pal.length;i++){var t=ln?ln+' '+pal[i]:pal[i];
    if(g.measureText(t).width>mw&&ln){
      if(n===max-1){while(g.measureText(ln+'…').width>mw&&ln.length>1)ln=ln.slice(0,-1);g.fillText(ln+'…',x,y);return y+lh}
      g.fillText(ln,x,y);y+=lh;n++;ln=pal[i]}else ln=t}
  if(ln){g.fillText(ln,x,y);y+=lh}return y;
}
function recortar(g,s,mw){while(g.measureText(s).width>mw&&s.length>2)s=s.slice(0,-1);return s}
function primerParrafo(t){
  var l=String(t||'').split('\n').map(function(s){return s.trim()}).filter(function(s){return s&&!/^[#|>\-*`]/.test(s)});
  return l[0]||'';
}
var FD='700 {n}px Unbounded, Arial Black, sans-serif',FB='{w} {n}px Archivo, Helvetica, Arial, sans-serif',FM='{w} {n}px "IBM Plex Mono", monospace';
function fd(n){return FD.replace('{n}',n)}function fb(n,w){return FB.replace('{n}',n).replace('{w}',w||400)}function fm(n,w){return FM.replace('{n}',n).replace('{w}',w||400)}
function papel(g,w,h,titulo,sub,color){
  g.fillStyle=BR.hueso;g.fillRect(0,0,w,h);
  g.fillStyle=color||BR.negro;g.fillRect(0,0,w,Math.round(h*.02)+6);
  var u=Math.round(h*.075);
  tx(g,titulo,w*.04,u*1.45,fd(u),BR.negro);
  if(sub)tx(g,sub,w*.96,u*1.4,fm(Math.round(u*.5)),'#5d584f','right');
}

/* ---------- dibujos de cada tablero ---------- */
function dibAgenda(g,w,h){
  var ev=lista('agenda').slice().sort(function(a,b){return (a.f+(a.h||'')).localeCompare(b.f+(b.h||''))});
  var h0=hoy(),prox=ev.filter(function(e){var d=pd(e.f);return d&&d>=h0}).length;
  papel(g,w,h,'AGENDA',prox+' próximos · hoy '+dd(h0));
  var top=h*.2,fil=(h-top-h*.05)/8,m=Math.round(fil*.34);
  ev.slice(0,8).forEach(function(e,i){
    var d=pd(e.f),y=top+i*fil,n=d?dias(d):0,pas=d&&n<0;
    g.globalAlpha=pas?.4:1;
    if(d&&n===0){g.fillStyle='rgba(139,42,54,.14)';g.fillRect(w*.03,y,w*.94,fil-4)}
    g.fillStyle=(SALA[e.sala]||{c:'#888'}).c;g.fillRect(w*.04,y+4,6,fil-12);
    tx(g,d?dd(d):'—',w*.06,y+fil*.5,fm(m+4,500),BR.negro);
    tx(g,e.h||'',w*.06,y+fil*.5+m+6,fm(m-2),'#5d584f');
    g.font=fb(m+6,500);var t=recortar(g,e.t||'',w*.58);tx(g,t,w*.2,y+fil*.5+3,fb(m+6,500),BR.negro);
    tx(g,d?rel(n):'',w*.96,y+fil*.5+3,fm(m),n===0?BR.bordo:'#5d584f','right');
    if(pas){g.strokeStyle=BR.negro;g.lineWidth=2;g.beginPath();g.moveTo(w*.2,y+fil*.5-4);g.lineTo(w*.2+Math.min(w*.58,g.measureText(t).width),y+fil*.5-4);g.stroke()}
    g.globalAlpha=1;
    g.fillStyle='rgba(0,0,0,.12)';g.fillRect(w*.04,y+fil-3,w*.92,1);
  });
  if(!ev.length)tx(g,'Sin eventos cargados',w*.5,h*.5,fb(26),'#6b655a','center');
  if(ev.length>8)tx(g,'+'+(ev.length-8)+' más · E para ver todo',w*.96,h-10,fm(15),'#5d584f','right');
}
function dibPend(g,w,h){
  var p=lista('pendientes');
  papel(g,w,h,'PENDIENTES',p.length+' abiertos',BR.bordo);
  var top=h*.2,n=Math.min(p.length,9),fil=(h-top-h*.07)/9,m=Math.round(fil*.3);
  p.slice(0,9).forEach(function(e,i){
    var y=top+i*fil;
    g.fillStyle=(SALA[e.sala]||{c:'#888'}).c;g.beginPath();g.arc(w*.055,y+fil*.38,m*.45,0,6.3);g.fill();
    ajustar(g,e.t,w*.1,y+fil*.38+4,w*.86,m+5,2,fb(m+3,500),BR.negro);
    g.fillStyle='rgba(0,0,0,.12)';g.fillRect(w*.04,y+fil-2,w*.92,1);
  });
  if(!p.length)tx(g,'Nada pendiente',w*.5,h*.5,fb(26),'#6b655a','center');
  if(p.length>9)tx(g,'+'+(p.length-9)+' más · E para ver todo',w*.96,h-10,fm(15),'#5d584f','right');
}
function dibDoc(clave,titulo,fechaClave){
  return function(g,w,h){
    var f=pd((D.estrategia||{})[fechaClave]),n=f?dias(f):null;
    papel(g,w,h,titulo,f?ddy(f):'sin fecha',BR.negro);
    var y=h*.26;
    if(n!==null){tx(g,rel(n),w*.04,y,fm(Math.round(h*.06),500),n<-7?BR.bordo:'#5d584f');y+=h*.1}
    var txt=primerParrafo(D[clave]);
    if(txt)ajustar(g,txt,w*.04,y,w*.92,h*.075,Math.floor((h*.9-y)/(h*.075)),fb(Math.round(h*.055),400),BR.negro);
    else tx(g,'Sin texto cargado',w*.04,y,fb(24),'#6b655a');
    tx(g,'E · leer completo',w*.96,h-12,fm(Math.round(h*.045)),'#5d584f','right');
  };
}

/* ================= tareas por personaje ================= */
function quienTarea(p){
  var t=p.t||'';
  if(/^(revisar|aprobar).*\bplan\b/i.test(t))return 'revisor';
  if(/informe|investigaci/i.test(t))return 'investigador';
  return NPCDEF[p.sala]?p.sala:'estrategia';
}
function tareasPorNpc(){
  var out={};Object.keys(NPCDEF).forEach(function(k){out[k]=[]});
  var alta=/^(aprobar|revisar)/i,media=/^(confirmar|definir|elegir|decidir)|por confirmar/i;
  lista('pendientes').forEach(function(p){
    var t=p.t||'',a=alta.test(t),m=!a&&media.test(t)&&!/cuando /i.test(t);if(!(a||m))return;
    out[quienTarea(p)].push({id:kPend(p),t:t,alta:a,p:p});
  });
  lista('piezas').forEach(function(p){
    if(p.estado!=='por aprobar'||HECHO[kPieza(p)])return;
    var d=pd(p.fecha),k=d?dd(d):'',tl=String(p.titulo||'').toLowerCase();
    var cub=out.diseno.some(function(x){var s=x.t.toLowerCase();return (k&&s.indexOf(k)>-1)||(tl&&s.indexOf(tl)>-1)});
    if(cub){out.diseno.forEach(function(x){if(k&&x.t.indexOf(k)>-1)x.pieza=p})}
    else out.diseno.push({id:'pz'+kPieza(p),t:'Aprobar «'+p.titulo+'»'+(d?' ('+dd(d)+')':''),alta:true,pieza:p});
  });
  var te=tests();
  if(te.falla)out.bot.push({id:'bot|tests|'+te.txt,t:'Los tests fallan: '+te.txt,alta:true,fija:true});
  return out;
}
function pendientesNpc(k,todos){var ahora=Date.now();return (TAREAS[k]||[]).filter(function(t){return todos||!(SNZ[t.id]>ahora)}).sort(function(a,b){return (b.alta?1:0)-(a.alta?1:0)})}
function cumplirTarea(t){if(t.pieza)aprobarPieza(t.pieza);else if(t.p)cumplirPend(t.p)}
function calcularTareas(){
  TAREAS=tareasPorNpc();
  Object.keys(npcs).forEach(function(k){
    var ts=pendientesNpc(k,true),n=npcs[k];n.marker.visible=ts.length>0;
    n.marker.material.color.set(ts.some(function(t){return t.alta})?0x8b2a36:0xcdbfa6);

  var bs=document.querySelectorAll('#nav button');
  for(var i=0;i<bs.length;i++){var z=bs[i].dataset.k;if(PUERTA[z])bs[i].classList.toggle('pend',!!porSala[z])}
  var hay=Object.keys(TAREAS).some(function(k){return TAREAS[k].some(function(t){return t.alta})});
  var bc=document.querySelector('#nav button[data-k="sillon"]');if(bc)bc.classList.toggle('pend',hay);
}
function lineaEstado(k){
  var e=D.estrategia||{};
  if(k==='investigador'){var f=pd(e.informe);return f?'Último informe: '+dd(f)+' ('+rel(dias(f))+').':''}
  if(k==='estrategia'){var f2=pd(e.plan);return f2?'Plan del '+dd(f2)+' ('+rel(dias(f2))+').':''}
  if(k==='revisor')return (TAREAS.revisor||[]).length+' por revisar.';
  if(k==='bot'){var b=D.bot||{};return 'Modo '+(b.modo||'sin dato')+(b.publica===false?' · no publica':'')}
  if(k==='diseno'){
    var p=lista('piezas').filter(function(x){var d=pd(x.fecha);return d&&d>=hoy()&&x.estado!=='publicado'}).sort(function(a,b){return a.fecha<b.fecha?-1:1})[0];
    return p?'Próxima pieza: '+p.titulo+' ('+dd(pd(p.fecha))+', '+p.estado+').':'';
  }
  if(k==='deposito')return 'Gorras: '+estadoLlegada((D.deposito||{}).gorras).txt+'.';
  return (D.recepcion||{}).productos||'';
}

/* ================= conversación con vos ================= */
function hablar(k,manual){
  if(dialogoAbierto)return;
  cancelarEscena();
  var n=npcs[k],d=NPCDEF[k],ts=pendientesNpc(k,manual).slice();
  vistaPrev={yaw:cam.yaw,pitch:cam.pitch};dialogoTareas=ts.slice();hablando=k;dialogoAbierto=true;n.estado='hablando';decir(n,null);
  $('app').classList.add('dlg');$('dQ').style.background=d.c;$('dN').textContent=d.nom+' · '+SALA[d.sala].n;
  var c=$('dT');c.textContent='';
  var tit=el('p',null,ts.length?SALUDO[k]:'Todo en orden por acá.');c.appendChild(tit);
  var ul=el('ul','tareas');
  ts.slice(0,4).forEach(function(t){
    var li=el('li');li.appendChild(el('span',null,t.t));
    if(!t.fija){var b=el('button','ck','Cumplido');b.type='button';b.addEventListener('click',function(){
      cumplirTarea(t);li.remove();dialogoTareas=dialogoTareas.filter(function(x){return x!==t});
      if(!dialogoTareas.length){tit.textContent='Listo, anotado. Gracias.';$('dDesp').textContent='Listo'}
    });li.appendChild(b)}
    ul.appendChild(li);
  });
  if(ts.length)c.appendChild(ul);
  if(ts.length>4)c.appendChild(el('p',null,'Y '+(ts.length-4)+' más en los pendientes.'));
  notasDe(d.sala,'confirmado').slice(0,2).forEach(function(x){c.appendChild(el('p','mono','Confirmado: '+NOTAS[x].t))});
  var le=lineaEstado(k);if(le)c.appendChild(el('p','mono',le));
  $('dVer').textContent=d.btn;$('dDesp').textContent=ts.length?'Después':'Listo';
  $('dialogo').classList.add('on');
  try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}
}
function cerrarDialogo(ms,abrir){
  if(!dialogoAbierto)return;
  var k=hablando,n=npcs[k];
  if(ms>0){dialogoTareas.forEach(function(t){SNZ[t.id]=Date.now()+ms});guardarSnz()}
  $('dialogo').classList.remove('on');$('app').classList.remove('dlg');dialogoAbierto=false;hablando=null;n.estado='volver';ultimoDialogo=performance.now();

}

}
var PEND_H={},PEND_N={};
function refrescar(){juntar();aplicar();ultR=0}
function leerVivo(){
  if(!leerClave()){conectado='no';refrescar();pedirClave('Ingresá la clave de la oficina para ver el estado del bot en vivo. Mientras tanto ves lo que dicen los documentos.');return Promise.resolve()}
  return api('/oficina').then(function(j){VIVO=j;conectado='vivo';$('clave').classList.remove('on');refrescar()}).catch(function(e){
    if(e.estado===401){conectado='clave';VIVO=null;refrescar();pedirClave('La clave no es válida.')}
    else{conectado='error';refrescar()}
  });
}
function cargarCI(){
  function uno(wf,k,nom){return fetch(GH+wf+'/runs?branch=main&per_page=1',{headers:{Accept:'application/vnd.github+json'}}).then(function(r){return r.ok?r.json():null}).then(function(j){
    var r=j&&j.workflow_runs&&j.workflow_runs[0];if(!r)return;var f=new Date(r.updated_at||r.created_at),c=r.conclusion||r.status;
    CI[k]='última corrida en main ('+String(f.getDate()).padStart(2,'0')+'/'+String(f.getMonth()+1).padStart(2,'0')+'): '+(c==='success'?'pasó':c==='failure'?'falló':c==='in_progress'||c==='queued'?'en curso':String(c))
  }).catch(function(){})}
  return Promise.all([uno('tests.yml','tests'),uno('evals-online.yml','evals')]).then(function(){if(VIVO||DOCS.D)refrescar()});
}
/* ----- acciones: se ven al instante y llegan al bot; si el servidor las rechaza, se deshacen ----- */
function enviar(body,ok,mal){
  return api('/oficina/accion',{body:body}).then(function(r){if(r&&r.juego&&VIVO)VIVO.juego=r.juego;ok&&ok();return true}).catch(function(e){mal&&mal();aviso(e.estado===401?'Clave inválida: no se guardó':'No se pudo guardar: '+(e.message||'error'));if(e.estado===401)pedirClave('La clave no es válida.');return false})
}
function cumplirPend(p){
  var k=kPend(p),o={t:p.t,sala:p.sala,cuando:ahoraISO()};PEND_H[k]=o;refrescar();
  enviar({accion:'cumplir',clave:k,texto:p.t,sala:p.sala},function(){aviso('Cumplido: le llega al bot y al próximo plan');leerVivo().then(function(){delete PEND_H[k];refrescar()})},function(){delete PEND_H[k];refrescar()});
}
function deshacerHecho(k){
  PEND_H[k]=null;refrescar();
  enviar({accion:'deshacer',clave:k},function(){leerVivo().then(function(){delete PEND_H[k];refrescar()})},function(){delete PEND_H[k];refrescar()});
}
function aprobarPieza(pz){
  var c=ahoraISO(),k=kPieza(pz),sal={};
  sal[k]={t:'Aprobó «'+pz.titulo+'»',sala:'diseno',tipo:'pieza',cuando:c};
  var d=pd(pz.fecha),f=d?dd(d):null;
  lista('pendientes').forEach(function(p){if(f&&p.sala==='diseno'&&/^(aprobar|revisar)/i.test(p.t||'')&&(p.t||'').indexOf(f)>-1)sal[kPend(p)]={t:p.t,sala:p.sala,cuando:c}});
  Object.keys(sal).forEach(function(x){PEND_H[x]=sal[x]});refrescar();
  var limpiar=function(){Object.keys(sal).forEach(function(x){delete PEND_H[x]});refrescar()};
  var seguir=function(){
    var cola=Object.keys(sal).reduce(function(pr,x){return pr.then(function(ok){return ok===false?false:enviar({accion:'cumplir',clave:x,texto:sal[x].t,sala:sal[x].sala,tipo:sal[x].tipo})})},Promise.resolve(true));
    cola.then(function(ok){if(ok===false){limpiar();return}aviso(pz._id?'Aprobada: el bot ya la tiene y te avisó por Telegram':'Aprobada y anotada para el bot');leerVivo().then(limpiar)});
  };
  if(pz._id)api('/oficina/accion',{body:{accion:'aprobar_pieza',id:pz._id}}).then(seguir).catch(function(e){limpiar();aviso(e.estado===409?e.message:'No se pudo aprobar: '+(e.message||'error'));if(e.estado===401)pedirClave('La clave no es válida.');leerVivo()});
  else seguir();
}
function agregarNota(t,sala,tipo){
  t=(t||'').trim();if(!t)return;var k='n'+Date.now().toString(36),o={t:t,sala:sala,tipo:tipo,cuando:ahoraISO()};PEND_N[k]=o;refrescar();
  var fin=function(){delete PEND_N[k];refrescar()};
  enviar({accion:'nota',clave:k,texto:t,sala:sala,tipo:tipo==='confirmado'?'confirmado':'anotacion'},function(){aviso('Anotado: le llega al bot');leerVivo().then(fin)},fin);
}
function quitarNota(k){
  PEND_N[k]=null;refrescar();var fin=function(){delete PEND_N[k];refrescar()};
  enviar({accion:'quitar_nota',clave:k},function(){leerVivo().then(fin)},fin);
}
function cargarDocs(){
  return fetch('/oficina/datos.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('sin datos');return r.json()}).then(function(j){DOCS=j}).catch(function(){conectado='error'});
}
async function conectar(){
  $('claveForm').addEventListener('submit',function(e){e.preventDefault();var v=$('claveIn').value.trim();if(!v)return;guardarClave(v);$('clave').classList.remove('on');leerVivo()});
  $('claveCerrar').addEventListener('click',function(){$('clave').classList.remove('on')});
  await cargarDocs();refrescar();
  leerVivo();cargarCI();
  setInterval(function(){if(!document.hidden)leerVivo()},10000);
  setInterval(function(){if(!document.hidden)cargarCI()},300000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden){leerVivo()}});
}

conectar();

})();
</script>
